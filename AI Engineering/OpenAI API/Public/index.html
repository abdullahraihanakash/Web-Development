<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Structured Outputs AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>AI Learning Assistant</h1>

        <p class="description">
            Enter a programming topic and get a structured AI explanation.
        </p>

        <input
            id="topic"
            type="text"
            placeholder="Example: JavaScript"
        >

        <button id="learn-btn">
            Explain
        </button>

        <p id="status"></p>

        <section id="result" class="result"></section>

    </main>

    <script src="script.js"></script>

</body>
</html>
