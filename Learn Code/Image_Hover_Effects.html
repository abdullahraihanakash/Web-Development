<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>

    <link rel="stylesheet" href="image_hover_effects.css">
</head>
<body>
    <div class="cards">

    <div class="card1">
        <img src="350 (6).jpg" alt="Nature">
    </div>
    <div class="card1">
        <img src="350 (7).jpg" alt="Nature">
    </div>

    <div class="card2">
    <img src="350 (5).jpg" alt="Nature">
    <div class="overlay">
        <h2>Amazing sports car</h2>
    </div>
    </div>

    </div>
    <h1 class="title">Hello World</h1>
    <h1 class="shadow-text">This is Shadow Text</h1>
    <h1 class="gradient-text">This is Gradient Text</h1>
    <h1 class="outline-text">This is Outline Text</h1>
    <h1 class="glow-text">This is Glow Text</h1>
    <h1 class="hover-text">This is Hover Text</h1>
    <h1 class="letter-spacing">Letter Spacing</h1>
    <h1 class="word-spacing">This is Word Spacing</h1>
    
</body>
</html>
